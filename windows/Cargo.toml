[package]
name = "moqcast-windows"
description = "Native Windows desktop application for MoQCast"
version = "0.5.0-dev.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[build-dependencies]
winresource = "=0.1.31"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"] }
moqcast-diagnostics = { path = "../shared/diagnostics" }
moqcast-ui = { path = "../shared/ui" }
moq-tokio = { git = "https://github.com/moq-dev/moq", rev = "615d166d246b04cde8d0449c80a556f22356f719", default-features = false, features = ["aws-lc-rs", "mdns", "noq"] }
rfd = "0.17.2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
thiserror = "2"
tracing = "0.1"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
hang = { git = "https://github.com/moq-dev/moq", rev = "615d166d246b04cde8d0449c80a556f22356f719" }
moq-audio = { git = "https://github.com/moq-dev/moq", rev = "615d166d246b04cde8d0449c80a556f22356f719", default-features = false, features = ["playback"] }
moq-mux = { git = "https://github.com/moq-dev/moq", rev = "615d166d246b04cde8d0449c80a556f22356f719" }
moq-video = { git = "https://github.com/moq-dev/moq", rev = "615d166d246b04cde8d0449c80a556f22356f719", default-features = false, features = ["capture", "openh264"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
