[package]
name = "moq-cast-desktop"
version = "0.4.1-dev.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace]
exclude = ["vendor/libspa", "vendor/moq-video"]

[patch.crates-io]
libspa = { path = "vendor/libspa" }

[dependencies]
anyhow = "1"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wayland", "wgpu", "x11"] }
moq-tokio = { git = "https://github.com/moq-dev/moq.git", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", default-features = false, features = ["aws-lc-rs", "mdns", "quinn"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
hang = { git = "https://github.com/moq-dev/moq.git", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53" }
moq-audio = { git = "https://github.com/moq-dev/moq.git", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", default-features = false, features = ["playback"] }
moq-mux = { git = "https://github.com/moq-dev/moq.git", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53" }
moq-video = { path = "vendor/moq-video", default-features = false, features = ["capture", "nvidia", "pipewire"] }
pipewire = "0.10"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros"] }
