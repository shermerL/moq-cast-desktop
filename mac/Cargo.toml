[package]
name = "moqcast-macos"
description = "Native macOS desktop application for MoQCast"
version = "0.4.1-dev.3"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["app"]
app = ["dep:block2", "dep:eframe", "dep:objc2-app-kit", "publish"]
network = ["dep:moq-tokio", "dep:url"]
watch = [
    "network",
    "dep:hang",
    "dep:moq-audio",
    "dep:moq-mux",
    "dep:moq-video",
    "moq-audio/playback",
]
publish = [
    "watch",
    "dep:objc2",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:objc2-screen-capture-kit",
    "moq-audio/capture",
    "moq-video/capture",
]
foundation = [
    "publish",
]

[dependencies]
anyhow = "1"
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"], optional = true }
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
url = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
hang = { git = "https://github.com/moq-dev/moq", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", optional = true }
moq-audio = { git = "https://github.com/moq-dev/moq", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", default-features = false, optional = true }
moq-mux = { git = "https://github.com/moq-dev/moq", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", optional = true }
moq-tokio = { git = "https://github.com/moq-dev/moq", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", default-features = false, features = ["aws-lc-rs", "mdns", "quinn"], optional = true }
moq-video = { git = "https://github.com/moq-dev/moq", rev = "81d39f7bf04c82aae324a9ee4251b7f8aa08fb53", default-features = false, optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWorkspace"], optional = true }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDirectDisplay", "CGWindow"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSNotification", "NSOperation", "NSString", "block2"], optional = true }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["SCContentSharingPicker", "SCShareableContent", "SCStream"], optional = true }

[[bin]]
name = "moqcast-macos"
path = "src/main.rs"
required-features = ["app"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
