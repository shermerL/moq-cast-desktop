[package]
name = "moqtcast-lite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Browse-only MoQTCast presence for the Windows notification area"
publish = false

[dependencies]
base64 = "=0.23.1"
getrandom = "=0.4.3"
httparse = "=1.10.1"
mdns-sd = "=0.21.0"
serde_json = "=1.0.151"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "=0.24.2", default-features = false }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
