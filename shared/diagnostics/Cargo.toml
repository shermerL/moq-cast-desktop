[package]
name = "moqcast-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
crossbeam-channel = "0.5.16"
file-rotate = { version = "0.8.0", default-features = false }
serde_json = "1.0.151"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
