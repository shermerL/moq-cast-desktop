name: Windows

on:
  push:
    branches: [main, dev]
    paths:
      - "windows/**"
      - "shared/diagnostics/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "shared/diagnostics/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: windows

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
            shared/diagnostics/target
          key: windows-cargo-${{ runner.os }}-rust1.95.0-${{ hashFiles('windows/Cargo.lock', 'shared/diagnostics/Cargo.lock') }}
          restore-keys: |
            windows-cargo-${{ runner.os }}-rust1.95.0-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run shared diagnostics tests
        working-directory: shared/diagnostics
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release desktop app
        run: cargo build --locked --release
        env:
          MOQCAST_BUILD_IDENTITY: windows-x86_64-msvc
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $path = "target/release/moqcast-windows.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([Text.Encoding]::ASCII.GetString($bytes, $pe, 4) -ne "PE`0`0") {
            throw "$path is not a PE image"
          }
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) {
            throw "$path uses PE subsystem $subsystem instead of Windows GUI (2)"
          }
      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: moqcast-windows-${{ github.sha }}
          path: windows/target/release/moqcast-windows.exe
          if-no-files-found: error
          retention-days: 14
