name: Windows

on:
  push:
    branches: [main, dev]
    paths:
      - "windows/**"
      - "shared/diagnostics/**"
      - "shared/ui/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "shared/diagnostics/**"
      - "shared/ui/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      wgc_moq_sha:
        description: "Optional exact shermerL/moq WGC commit SHA (40 lowercase hex characters)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: windows

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
            shared/diagnostics/target
          key: windows-cargo-${{ runner.os }}-rust1.95.0-${{ hashFiles('windows/Cargo.lock', 'shared/diagnostics/Cargo.lock', 'shared/ui/Cargo.lock') }}
          restore-keys: |
            windows-cargo-${{ runner.os }}-rust1.95.0-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check desktop targets
        run: cargo check --locked --all-targets
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Run shared diagnostics tests
        working-directory: shared/diagnostics
        run: cargo test --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release desktop app
        run: cargo build --locked --release
        env:
          MOQCAST_BUILD_IDENTITY: windows-x86_64-msvc
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify Windows GUI subsystem
        shell: pwsh
        run: |
          $path = "target/release/moqcast-windows.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([Text.Encoding]::ASCII.GetString($bytes, $pe, 4) -ne "PE`0`0") {
            throw "$path is not a PE image"
          }
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) {
            throw "$path uses PE subsystem $subsystem instead of Windows GUI (2)"
          }
      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: moqcast-windows-${{ github.sha }}
          path: windows/target/release/moqcast-windows.exe
          if-no-files-found: error
          retention-days: 14

  wgc:
    name: WGC experimental desktop
    if: github.event_name == 'workflow_dispatch' && inputs.wgc_moq_sha != ''
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop/windows
    env:
      WGC_MOQ_SHA: ${{ inputs.wgc_moq_sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/desktop/windows/target
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop
      - name: Require an immutable fork revision
        shell: pwsh
        run: |
          if ($env:WGC_MOQ_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "WGC requires an exact lowercase 40-character commit SHA"
          }
      - uses: actions/checkout@v4
        with:
          repository: shermerL/moq
          ref: ${{ inputs.wgc_moq_sha }}
          fetch-depth: 0
          path: moq-wgc
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Cache experimental Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/windows/target
          key: windows-wgc-${{ runner.os }}-rust1.95.0-${{ hashFiles('desktop/windows/Cargo.lock') }}-${{ inputs.wgc_moq_sha }}
          restore-keys: |
            windows-wgc-${{ runner.os }}-rust1.95.0-
            windows-cargo-${{ runner.os }}-rust1.95.0-
      - name: Check CI helper tests
        run: python -m unittest discover -s scripts -p "test_ci_wgc.py"
      - name: Prepare isolated sources and freeze experimental lock
        shell: pwsh
        run: |
          python scripts/ci-wgc.py prepare --moq "$env:GITHUB_WORKSPACE/moq-wgc" --moq-sha "$env:WGC_MOQ_SHA" --output "$env:RUNNER_TEMP/moqcast-wgc"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check WGC desktop targets
        run: cargo check --manifest-path "$env:WGC_MANIFEST" --config "$env:WGC_CONFIG" --locked --features wgc --all-targets
      - name: Run WGC desktop tests
        run: cargo test --manifest-path "$env:WGC_MANIFEST" --config "$env:WGC_CONFIG" --locked --features wgc --all-targets
      - name: Run WGC Clippy
        run: cargo clippy --manifest-path "$env:WGC_MANIFEST" --config "$env:WGC_CONFIG" --locked --features wgc --all-targets -- -D warnings
      - name: Build WGC release desktop app
        run: cargo build --manifest-path "$env:WGC_MANIFEST" --config "$env:WGC_CONFIG" --locked --features wgc --release
        env:
          MOQCAST_BUILD_IDENTITY: windows-x86_64-msvc-wgc-experimental
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Package WGC executable with checksums and provenance
        shell: pwsh
        run: |
          python scripts/ci-wgc.py package --output "$env:RUNNER_TEMP/moqcast-wgc" --exe "$env:CARGO_TARGET_DIR/release/moqcast-windows.exe"
          git diff --exit-code -- Cargo.lock
      - name: Upload experimental WGC package
        uses: actions/upload-artifact@v4
        with:
          name: moqcast-windows-wgc-${{ github.sha }}
          path: ${{ runner.temp }}/moqcast-wgc/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload frozen WGC build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moqcast-windows-wgc-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/moqcast-wgc/evidence/*
          if-no-files-found: ignore
          retention-days: 14
