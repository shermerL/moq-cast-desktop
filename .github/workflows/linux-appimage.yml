name: Linux AppImage

on:
  push:
    branches:
      - main
    paths:
      - "linux/**"
      - "shared/diagnostics/**"
      - "shared/ui/**"
      - ".github/workflows/linux-appimage.yml"
  pull_request:
    paths:
      - "linux/**"
      - "shared/diagnostics/**"
      - "shared/ui/**"
      - ".github/workflows/linux-appimage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Test shared diagnostics
        run: cargo test --locked --manifest-path shared/diagnostics/Cargo.toml
      - name: Lint shared diagnostics
        run: cargo clippy --locked --manifest-path shared/diagnostics/Cargo.toml --all-targets -- -D warnings

  appimage:
    needs: diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-x86_64-ubuntu22.04-glibc2.35
            image: ubuntu:22.04
            intended_targets: ubuntu-22.04,mint-21
          - variant: linux-x86_64-ubuntu24.04-glibc2.39
            image: ubuntu:24.04
            intended_targets: ubuntu-24.04,ubuntu-26.04,mint-22
          - variant: linux-x86_64-debian12-glibc2.36
            image: debian:12
            intended_targets: debian-12
          - variant: linux-x86_64-debian13-glibc2.41
            image: debian:13
            intended_targets: debian-13
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            desktop-file-utils \
            file \
            git \
            libasound2-dev \
            libclang-dev \
            libgl1-mesa-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            nasm \
            patchelf \
            pkg-config

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf -o "$RUNNER_TEMP/rustup-init.sh" https://sh.rustup.rs
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Cache Cargo release build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target/release
          key: linux-cargo-${{ matrix.variant }}-rust1.95.0-${{ hashFiles('linux/Cargo.lock', 'shared/diagnostics/Cargo.lock', 'shared/ui/Cargo.lock') }}
          restore-keys: |
            linux-cargo-${{ matrix.variant }}-rust1.95.0-

      - name: Download AppImage tooling
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -L -o "$RUNNER_TEMP/appimage-tools/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimage-tools/linuxdeploy"

      - name: Test Linux implementation
        working-directory: linux
        run: cargo test --locked

      - name: Build AppImage
        working-directory: linux
        env:
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
          MOQCAST_PACKAGE_VARIANT: ${{ matrix.variant }}
          MOQCAST_INTENDED_TARGETS: ${{ matrix.intended_targets }}
        run: |
          LINUXDEPLOY="$RUNNER_TEMP/appimage-tools/linuxdeploy" \
          ./scripts/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: moqcast-${{ matrix.variant }}
          path: |
            linux/target/package/*.AppImage
            linux/target/package/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
