name: macOS

on:
  push:
    branches: [main, dev]
    paths:
      - "mac/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mac

jobs:
  verify-and-package:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mac/target
          key: macos-cargo-${{ runner.arch }}-rust1.95.0-${{ hashFiles('mac/Cargo.lock') }}
          restore-keys: |
            macos-cargo-${{ runner.arch }}-rust1.95.0-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run foundation tests
        run: cargo test --locked --all-targets
      - name: Run Clippy with locked MoQ foundation
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build arm64 release app
        run: cargo build --locked --release --all-features --target aarch64-apple-darwin
        env:
          MOQCAST_BUILD_IDENTITY: macos-universal2
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Build x86_64 release app
        run: cargo build --locked --release --all-features --target x86_64-apple-darwin
        env:
          MOQCAST_BUILD_IDENTITY: macos-universal2
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Package ad hoc signed Universal 2 app
        run: |
          ./scripts/package-app.sh \
            target/aarch64-apple-darwin/release/moqcast-macos \
            target/x86_64-apple-darwin/release/moqcast-macos \
            "$RUNNER_TEMP/moqcast-package"
        env:
          MOQCAST_BUILD_VERSION: ${{ github.run_number }}
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Verify package metadata
        run: |
          plutil -lint "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/Info.plist")" = "dev.moq.moqcast.macos"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/Info.plist")" = "14.2"
          lipo -info "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/MacOS/moqcast-macos"
          xcrun vtool -show-build -arch arm64 "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/MacOS/moqcast-macos" | grep -Eq "minos +14\.2"
          xcrun vtool -show-build -arch x86_64 "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/MacOS/moqcast-macos" | grep -Eq "minos +14\.2"
          codesign --verify --deep --strict "$RUNNER_TEMP/moqcast-package/MoQCast.app"
          codesign -dv --verbose=4 "$RUNNER_TEMP/moqcast-package/MoQCast.app" 2>&1 | grep -q "Signature=adhoc"
          grep -Fxq "source_commit=${{ github.sha }}" "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/Resources/build-info.txt"
          grep -Fxq "minimum_macos=14.2" "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/Resources/build-info.txt"
          grep -Fxq "moq_dependency=moq-dev/moq@81d39f7bf04c82aae324a9ee4251b7f8aa08fb53" "$RUNNER_TEMP/moqcast-package/MoQCast.app/Contents/Resources/build-info.txt"
          mkdir "$RUNNER_TEMP/moqcast-checksum-verification"
          cp "$RUNNER_TEMP"/moqcast-package/MoQCast-macOS-universal2-*.zip* "$RUNNER_TEMP/moqcast-checksum-verification/"
          cd "$RUNNER_TEMP/moqcast-checksum-verification"
          shasum -a 256 -c MoQCast-macOS-universal2-*.zip.sha256
      - name: Upload ad hoc signed macOS app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moqcast-macos-universal2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/moqcast-package/MoQCast-macOS-universal2-*.zip
            ${{ runner.temp }}/moqcast-package/MoQCast-macOS-universal2-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
