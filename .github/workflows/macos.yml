name: macOS

on:
  push:
    branches: [main, dev]
    paths:
      - "mac/**"
      - "shared/build-provenance/**"
      - "shared/diagnostics/**"
      - "shared/ui/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "mac/**"
      - "shared/build-provenance/**"
      - "shared/diagnostics/**"
      - "shared/ui/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mac

jobs:
  verify:
    name: Verify macOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate workflow contract
        run: bash ./scripts/check-ci-workflow.sh
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ runner.arch }}-rust1.95.0-${{ hashFiles('mac/Cargo.lock', 'shared/build-provenance/Cargo.lock', 'shared/diagnostics/Cargo.lock', 'shared/ui/Cargo.lock') }}
          restore-keys: |
            macos-cargo-${{ runner.arch }}-rust1.95.0-
      - name: Verify shared diagnostics
        working-directory: shared/diagnostics
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Verify build provenance generator
        working-directory: shared/build-provenance
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all --check
      # Real mDNS and LAN smoke tests require a local network and remain a Mac/device acceptance gate.
      - name: Run default-feature tests
        run: cargo test --locked --all-targets
      - name: Run no-default-features contract tests
        run: cargo test --locked --no-default-features --lib
      - name: Run default-feature Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build-release:
    name: Build ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ runner.arch }}-rust1.95.0-${{ hashFiles('mac/Cargo.lock', 'shared/build-provenance/Cargo.lock', 'shared/diagnostics/Cargo.lock', 'shared/ui/Cargo.lock') }}
          restore-keys: |
            macos-cargo-${{ runner.arch }}-rust1.95.0-
      - name: Build release app
        run: cargo build --locked --release --target "${{ matrix.target }}"
        env:
          MOQCAST_BUILD_IDENTITY: macos-universal2-adhoc
          MOQCAST_PROVENANCE_OUTPUT: target/${{ matrix.target }}/release/moqcast-build-info.txt
          MOQCAST_SOURCE_COMMIT: ${{ github.sha }}
      - name: Upload release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoQCast-macOS-binary-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/mac/target/${{ matrix.target }}/release/moqcast-macos
            ${{ github.workspace }}/mac/target/${{ matrix.target }}/release/moqcast-build-info.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package:
    name: Package Universal 2 app
    needs: [verify, build-release]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download arm64 release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MoQCast-macOS-binary-aarch64-apple-darwin
          path: ${{ runner.temp }}/moqcast-binary/aarch64-apple-darwin
      - name: Download x86_64 release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MoQCast-macOS-binary-x86_64-apple-darwin
          path: ${{ runner.temp }}/moqcast-binary/x86_64-apple-darwin
      - name: Verify release binary artifacts
        run: |
          arm64="$RUNNER_TEMP/moqcast-binary/aarch64-apple-darwin/moqcast-macos"
          arm64_provenance="$RUNNER_TEMP/moqcast-binary/aarch64-apple-darwin/moqcast-build-info.txt"
          x86_64="$RUNNER_TEMP/moqcast-binary/x86_64-apple-darwin/moqcast-macos"
          x86_64_provenance="$RUNNER_TEMP/moqcast-binary/x86_64-apple-darwin/moqcast-build-info.txt"
          test -f "$arm64"
          test -f "$arm64_provenance"
          test -f "$x86_64"
          test -f "$x86_64_provenance"
          lipo "$arm64" -verify_arch arm64
          lipo "$x86_64" -verify_arch x86_64
      - name: Package ad hoc signed Universal 2 app
        run: |
          ./scripts/package-app.sh \
            "$RUNNER_TEMP/moqcast-binary/aarch64-apple-darwin/moqcast-macos" \
            "$RUNNER_TEMP/moqcast-binary/aarch64-apple-darwin/moqcast-build-info.txt" \
            "$RUNNER_TEMP/moqcast-binary/x86_64-apple-darwin/moqcast-macos" \
            "$RUNNER_TEMP/moqcast-binary/x86_64-apple-darwin/moqcast-build-info.txt" \
            "$RUNNER_TEMP/moqcast-package"
        env:
          MOQCAST_BUILD_VERSION: ${{ github.run_number }}
      - name: Verify package metadata
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          marketing_version="${package_version%%-*}"
          app="$RUNNER_TEMP/moqcast-package/MoQCast.app"
          plist="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/moqcast-macos"
          build_info="$app/Contents/Resources/build-info.txt"
          archive="$RUNNER_TEMP/moqcast-package/MoQCast-macOS-${package_version}.zip"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "MoQCast"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")" = "moqcast-macos"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "dev.moq.moqcast.macos"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")" = "MoQCast.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$plist")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$marketing_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${{ github.run_number }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "14.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "$plist")" = "_moq._udp"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$plist")"
          test -f "$app/Contents/Resources/MoQCast.icns"
          iconutil -c iconset -o "$RUNNER_TEMP/moqcast-package/MoQCast.iconset" \
            "$app/Contents/Resources/MoQCast.icns"
          test -f "$RUNNER_TEMP/moqcast-package/MoQCast.iconset/icon_16x16.png"
          test -f "$RUNNER_TEMP/moqcast-package/MoQCast.iconset/icon_512x512@2x.png"
          lipo "$binary" -verify_arch arm64 x86_64
          lipo -info "$binary"
          xcrun vtool -show-build -arch arm64 "$binary" | grep -Eq "minos +14\.2"
          xcrun vtool -show-build -arch x86_64 "$binary" | grep -Eq "minos +14\.2"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Signature=adhoc"
          grep -Fxq "app_version=${package_version}" "$build_info"
          grep -Fxq "build_identity=macos-universal2-adhoc" "$build_info"
          grep -Fxq "source_identity=${{ github.sha }}" "$build_info"
          grep -Fxq "source_commit=${{ github.sha }}" "$build_info"
          grep -Fxq "source_state=clean" "$build_info"
          grep -Fxq "target=universal2-apple-darwin" "$build_info"
          grep -Fxq "minimum_macos=14.2" "$build_info"
          moq_revision="$(sed -n 's/^moq_revision=//p' "$build_info")"
          test "$(printf '%s' "$moq_revision" | wc -c | tr -d ' ')" = "40"
          printf '%s' "$moq_revision" | grep -Eq '^[0-9a-f]{40}$'
          grep -Fxq "dependency_identity=moq-dev/moq@${moq_revision}" "$build_info"
          test -f "$archive"
          test -f "$archive.sha256"
          cd "$(dirname "$archive")"
          shasum -a 256 -c "$(basename "$archive").sha256"
      - name: Upload ad hoc signed macOS app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MoQCast-macOS
          path: |
            ${{ runner.temp }}/moqcast-package/MoQCast-macOS-*.zip
            ${{ runner.temp }}/moqcast-package/MoQCast-macOS-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
