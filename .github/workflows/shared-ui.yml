name: Shared UI

on:
  push:
    branches: [main, dev]
    paths:
      - "shared/ui/**"
      - ".github/workflows/shared-ui.yml"
  pull_request:
    paths:
      - "shared/ui/**"
      - ".github/workflows/shared-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify shared UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/ui/target
          key: shared-ui-cargo-${{ runner.os }}-rust1.95.0-${{ hashFiles('shared/ui/Cargo.lock') }}
          restore-keys: |
            shared-ui-cargo-${{ runner.os }}-rust1.95.0-
      - name: Check formatting
        run: cargo fmt --all --check --manifest-path shared/ui/Cargo.toml
      - name: Run tests
        run: cargo test --locked --manifest-path shared/ui/Cargo.toml --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path shared/ui/Cargo.toml --all-targets -- -D warnings
      - name: Build component catalog
        run: cargo build --locked --manifest-path shared/ui/Cargo.toml --example catalog
      - name: Build documentation
        run: cargo doc --locked --manifest-path shared/ui/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
